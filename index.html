<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dayita - Item Matcher</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS for reading Excel/CSV files -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .drag-active {
            border-color: #3b82f6;
            background-color: #eff6ff;
        }
        /* Simple toast animation */
        @keyframes fade-in-out {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-20px); }
        }
        .toast {
            animation: fade-in-out 2s forwards;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans text-slate-800 relative">

    <!-- Header -->
    <header class="bg-blue-700 text-white shadow-lg sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="boxes" class="w-6 h-6"></i>
                <h1 class="text-xl font-bold tracking-tight">Dayita - Item Matcher For D & H Secheron</h1>
            </div>
            <div class="text-sm opacity-90 hidden sm:block">Fast & Secure Local Search</div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- File Upload Section -->
        <div id="upload-section" class="bg-white rounded-xl shadow-sm border-2 border-dashed border-slate-300 p-10 text-center transition-all duration-200">
            <div class="flex flex-col items-center gap-4">
                <div class="p-4 bg-blue-50 rounded-full text-blue-600">
                    <i data-lucide="upload-cloud" class="w-8 h-8"></i>
                </div>
                <h2 class="text-xl font-semibold text-slate-700">Upload Inventory File</h2>
                <p class="text-slate-500 max-w-md mx-auto">Drag and drop your <strong>.xlsx</strong> or <strong>.csv</strong> file here, or click to browse.</p>
                
                <input type="file" id="file-input" accept=".csv, application/vnd.openxmlformats-officedocument.spreadsheetml.sheet, application/vnd.ms-excel" class="hidden" />
                
                <button onclick="document.getElementById('file-input').click()" class="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg transition-colors shadow-sm">
                    Select File
                </button>
            </div>
        </div>

        <!-- Search & Data Section (Hidden initially) -->
        <div id="data-section" class="hidden space-y-6">
            
            <!-- Search Bar -->
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col md:flex-row gap-4 items-center sticky top-20 z-20">
                <div class="relative flex-grow w-full">
                    <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                    <input type="text" id="search-input" placeholder="Search item, size, brand (e.g., 'Secheron 308L' or '5.00X450')" 
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all"
                        autocomplete="off">
                </div>
                
                <div class="flex items-center gap-3 w-full md:w-auto flex-wrap md:flex-nowrap">
                    <div class="px-4 py-2 bg-slate-100 rounded-lg text-sm text-slate-600 font-medium whitespace-nowrap">
                        <span id="result-count">0</span> items
                    </div>
                    
                    <button onclick="downloadResults()" class="flex items-center gap-2 px-4 py-2 bg-green-600 hover:bg-green-700 text-white text-sm font-medium rounded-lg transition-colors whitespace-nowrap shadow-sm">
                        <i data-lucide="download" class="w-4 h-4"></i> Export
                    </button>

                    <button onclick="resetApp()" class="px-4 py-2 text-red-600 hover:bg-red-50 text-sm font-medium rounded-lg transition-colors whitespace-nowrap">
                        Clear
                    </button>
                </div>
            </div>

            <!-- Results Table -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-slate-50 border-b border-slate-200">
                            <tr>
                                <th class="p-4 font-semibold text-slate-600 text-sm w-36">Item Code</th>
                                <th class="p-4 font-semibold text-slate-600 text-sm">Description</th>
                                <th class="p-4 font-semibold text-slate-600 text-sm w-32">Location</th>
                                <th class="p-4 font-semibold text-slate-600 text-sm w-40">Pack Size</th>
                                <th class="p-4 font-semibold text-slate-600 text-sm w-32">Updated</th>
                            </tr>
                        </thead>
                        <tbody id="table-body" class="divide-y divide-slate-100 text-sm text-slate-700">
                            <!-- Rows injected here -->
                        </tbody>
                    </table>
                </div>
                
                <!-- Empty State -->
                <div id="empty-state" class="hidden p-12 text-center text-slate-500">
                    <i data-lucide="search-x" class="w-12 h-12 mx-auto mb-3 text-slate-300"></i>
                    <p>No matching items found.</p>
                </div>
            </div>
        </div>

    </main>
    
    <!-- Copy Toast Notification -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 pointer-events-none"></div>

    <script>
        // --- State Management ---
        let inventoryData = [];
        let filteredData = []; // Store currently visible data for export
        const uploadSection = document.getElementById('upload-section');
        const dataSection = document.getElementById('data-section');
        const fileInput = document.getElementById('file-input');
        const searchInput = document.getElementById('search-input');
        const tableBody = document.getElementById('table-body');
        const resultCount = document.getElementById('result-count');
        const emptyState = document.getElementById('empty-state');
        const toastContainer = document.getElementById('toast-container');

        // --- Icon Setup ---
        lucide.createIcons();

        // --- Event Listeners ---
        
        // Drag & Drop
        uploadSection.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadSection.classList.add('drag-active');
        });

        uploadSection.addEventListener('dragleave', () => {
            uploadSection.classList.remove('drag-active');
        });

        uploadSection.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadSection.classList.remove('drag-active');
            if (e.dataTransfer.files.length) {
                handleFile(e.dataTransfer.files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) {
                handleFile(e.target.files[0]);
            }
        });

        // Search Input
        searchInput.addEventListener('input', (e) => {
            renderTable(e.target.value);
        });

        // --- Core Functions ---

        function handleFile(file) {
            const reader = new FileReader();

            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });

                // Assuming first sheet is the one we want
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];

                // Convert to JSON
                const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                if (jsonData.length > 0) {
                    inventoryData = jsonData;
                    filteredData = jsonData; // Initialize filtered with all
                    showDataUI();
                    renderTable();
                } else {
                    alert("The file appears to be empty or unreadable.");
                }
            };

            reader.readAsArrayBuffer(file);
        }

        function showDataUI() {
            uploadSection.classList.add('hidden');
            dataSection.classList.remove('hidden');
            searchInput.focus();
        }

        function resetApp() {
            inventoryData = [];
            filteredData = [];
            fileInput.value = '';
            searchInput.value = '';
            uploadSection.classList.remove('hidden');
            dataSection.classList.add('hidden');
        }

        function renderTable(searchTerm = "") {
            tableBody.innerHTML = "";
            const rawTerms = searchTerm.toLowerCase().split(" ").filter(t => t.length > 0);
            
            // Helper: normalize string
            const normalize = (str) => str.toLowerCase().replace(/[^a-z0-9.]/g, "");

            filteredData = inventoryData.filter(item => {
                if (rawTerms.length === 0) return true;

                const originalString = `
                    ${item['Item Code'] || ''} 
                    ${item['Description'] || ''} 
                    ${item['Location'] || ''} 
                    ${item['Pack Size'] || ''}
                `.toLowerCase();

                const smartString = normalize(originalString);

                return rawTerms.every(term => {
                    const cleanTerm = normalize(term);
                    return originalString.includes(term) || (cleanTerm.length > 0 && smartString.includes(cleanTerm));
                });
            });

            resultCount.textContent = filteredData.length;

            if (filteredData.length === 0) {
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Render Rows (Limit to 100 for performance if query is empty)
            const displayLimit = searchTerm === "" ? 100 : 500;
            
            filteredData.slice(0, displayLimit).forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition-colors group";
                
                const itemCode = item['Item Code'] || '-';
                
                tr.innerHTML = `
                    <td class="p-4">
                        <div class="flex items-center gap-2">
                            <span class="font-mono text-xs font-semibold text-blue-600">${itemCode}</span>
                            <button onclick="copyToClipboard('${itemCode}')" class="opacity-0 group-hover:opacity-100 transition-opacity text-slate-400 hover:text-blue-600 p-1" title="Copy Item Code">
                                <i data-lucide="copy" class="w-3 h-3"></i>
                            </button>
                        </div>
                    </td>
                    <td class="p-4 font-medium">${item['Description'] || '-'}</td>
                    <td class="p-4">
                        <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-green-100 text-green-800">
                            ${item['Location'] || '-'}
                        </span>
                    </td>
                    <td class="p-4 text-slate-500">${item['Pack Size'] || '-'}</td>
                    <td class="p-4 text-slate-400 text-xs">${item['Date updated'] || '-'}</td>
                `;
                tableBody.appendChild(tr);
            });
            lucide.createIcons();
        }

        // --- Export Feature ---
        function downloadResults() {
            if (filteredData.length === 0) {
                alert("No data to export!");
                return;
            }
            const worksheet = XLSX.utils.json_to_sheet(filteredData);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "SearchResults");
            XLSX.writeFile(workbook, "Dayita_SearchResults.xlsx");
        }

        // --- Copy Feature ---
        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showToast(`Copied: ${text}`);
            });
        }

        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = "toast bg-slate-800 text-white px-4 py-2 rounded-lg shadow-lg text-sm mb-2";
            toast.textContent = message;
            toastContainer.appendChild(toast);
            
            // Auto remove after animation ends (2s)
            setTimeout(() => {
                toast.remove();
            }, 2000);
        }
    </script>
</body>
</html>
